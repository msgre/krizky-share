[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krizky-share"
version = "0.1.0"
description = "Social sharing plugin for krizky static site generator"
requires-python = ">=3.12"
dependencies = [
    "krizky>=0.1",
]

[project.entry-points."krizky"]
share = "krizky_share.plugin:plugin"

[tool.hatch.build.targets.wheel]
packages = ["krizky_share"]

[tool.uv.sources]
krizky = { git = "https://github.com/msgre/krizky.git" }

[dependency-groups]
dev = [
    "pytest>=8.0",
]
